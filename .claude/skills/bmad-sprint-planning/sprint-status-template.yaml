# Sprint Status Template
# This is an EXAMPLE showing the unified three-section schema format.
# The actual file will be generated/refreshed from your epics and bug files.
#
# Schema version: 1.0 (Story 17.9)
# Architecture: Decision P2-11
#
# SECTIONS:
#   epics   — map keyed by epic-N; regenerated each planning run (with status preservation)
#   backlog — array of items (stories + bugs); additive — new items appended, existing preserved
#   sprints — map keyed by sprint-N; NEVER modified by this skill
#
# STATUS DEFINITIONS:
# ===================
# Epic Status:   backlog → in-progress → done  (on-hold: bidirectional; cancelled: terminal)
# Item Status:   backlog → ready-for-dev → in-progress → review → done
#                (on-hold: bidirectional pause; cancelled: terminal)
# Retrospective: optional → done  (null: not applicable)

generated: "2026-01-15T10:00:00Z"
last_updated: "2026-01-15T10:00:00Z"
project: "Example Project"
project_key: NOKEY
tracking_system: file-system
story_location: "_bmad-output/implementation-artifacts"

# ── Epics ──────────────────────────────────────────────────────────────────────
# Map keyed by epic-N. Fully regenerated each run; epic statuses are never downgraded.
epics:
  epic-1:
    status: in-progress
    retrospective: optional
  epic-2:
    status: backlog
    retrospective: optional
  epic-3:
    status: on-hold
    retrospective: null

# ── Backlog ───────────────────────────────────────────────────────────────────
# Ordered array — position 0 = highest priority. Priority field must match position.
# Only items NOT in a sprint and NOT archived in done/ appear here.
backlog:
  - id: "1-2-account-management"
    type: story
    epic: 1
    title: "Account Management"
    priority: 1
    status: ready-for-dev
    severity: null
  - id: "BUG-login-crash"
    type: bug
    epic: null
    title: "Fix login crash on empty password"
    priority: 2
    status: backlog
    severity: critical
  - id: "2-1-personality-system"
    type: story
    epic: 2
    title: "Personality System"
    priority: 3
    status: backlog
    severity: null
  - id: "2-2-chat-interface"
    type: story
    epic: 2
    title: "Chat Interface"
    priority: 4
    status: backlog
    severity: null

# ── Sprints ───────────────────────────────────────────────────────────────────
# Map keyed by sprint-N. This skill NEVER modifies the sprints section.
# Use add-sprint, add-to-sprint, modify-sprint, close-sprint to manage sprints.
